<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calisthenics Progress Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <button class="nav-btn active" data-page="log">Log Workout</button>
        <button class="nav-btn" data-page="exercises">Exercises</button>
        <button class="nav-btn" data-page="skills">Skills</button>
        <button class="nav-btn" data-page="progress">Progress</button>
    </nav>

    <main class="container">
        <!-- Log Workout Page -->
        <div id="log-page" class="page active">
            <h1>Log Workout</h1>
            <form id="workout-form">
                <div class="form-group">
                    <label for="exercise-select">Exercise:</label>
                    <select id="exercise-select" required>
                        <option value="">Select an exercise...</option>
                    </select>
                </div>
                <div class="form-group" id="reps-group">
                    <label>Sets × Reps:</label>
                    <div id="sets-container">
                        <div class="set-group">
                            <input type="number" class="set-count" min="1" value="1" placeholder="Sets">
                            <span>×</span>
                            <input type="number" class="rep-count" min="0" value="0" placeholder="Reps">
                            <button type="button" class="remove-set-group" style="display: none;">Remove</button>
                        </div>
                    </div>
                    <button type="button" id="add-set-group-btn" class="btn-secondary">Add Set Group</button>
                </div>
                <div class="form-group" id="time-group" style="display: none;">
                    <label for="time">Time (seconds):</label>
                    <input type="number" id="time" min="0" value="0" step="0.1">
                </div>
                <div class="form-group" id="assistance-group" style="display: none;">
                    <label for="assistance">Assistance/Weight:</label>
                    <input type="text" id="assistance" placeholder="e.g., 'light band', '10kg'">
                </div>
                <div class="form-group">
                    <label for="notes">Notes:</label>
                    <textarea id="notes" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="workout-date">Date:</label>
                    <input type="date" id="workout-date" required>
                </div>
                <button type="submit">Log Workout</button>
            </form>
            <div id="workout-logs">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
                    <h2 style="margin: 0;">Recent Logs</h2>
                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        <button id="export-logs-btn" class="btn-export" style="padding: 0.75rem 1.5rem; font-size: 1rem; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.3s;">📥 Export Logs</button>
                        <button id="import-logs-btn" class="btn-import" style="padding: 0.75rem 1.5rem; font-size: 1rem; background-color: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.3s;">📤 Import Logs</button>
                    </div>
                </div>
                <input type="file" id="import-file-input" accept=".json" style="display: none;">
                <div id="logs-list"></div>
            </div>
            
            <!-- Import Modal -->
            <div id="import-modal" class="modal">
                <div class="modal-content">
                    <span class="close" id="close-import-modal">&times;</span>
                    <h2>Import Training Logs</h2>
                    <div id="import-options" style="margin: 1rem 0;">
                        <div class="form-group">
                            <label>
                                <input type="radio" name="import-mode" value="replace" checked>
                                Replace all data
                            </label>
                            <label>
                                <input type="radio" name="import-mode" value="merge">
                                Merge with existing data
                            </label>
                        </div>
                        <div id="merge-options" style="display: none; margin-top: 1rem; padding: 1rem; background: #f5f5f5; border-radius: 4px;">
                            <label>
                                <input type="checkbox" id="merge-exercises">
                                Import exercises (if not already existing)
                            </label>
                            <br>
                            <label>
                                <input type="checkbox" id="merge-skills">
                                Import skills (if not already existing)
                            </label>
                        </div>
                        <div id="import-preview" style="margin-top: 1rem; padding: 1rem; background: #e8f5e9; border-radius: 4px; display: none;">
                            <p><strong>File preview:</strong></p>
                            <p id="import-preview-text"></p>
                        </div>
                        <div id="import-result" style="margin-top: 1rem; display: none;"></div>
                    </div>
                    <button id="confirm-import-btn" class="btn-primary" style="display: none;">Confirm Import</button>
                    <button type="button" class="btn-secondary" id="cancel-import">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Exercises Page -->
        <div id="exercises-page" class="page">
            <h1>Exercises</h1>
            <button id="add-exercise-btn" class="btn-primary">Add Exercise</button>
            <div id="exercises-list"></div>
            
            <!-- Add/Edit Exercise Modal -->
            <div id="exercise-modal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2 id="modal-title">Add Exercise</h2>
                    <form id="exercise-form">
                        <input type="hidden" id="exercise-id">
                        <div class="form-group">
                            <label for="exercise-name">Name:</label>
                            <input type="text" id="exercise-name" required>
                        </div>
                        <div class="form-group">
                            <label for="exercise-type">Type:</label>
                            <select id="exercise-type" required>
                                <option value="reps">Reps</option>
                                <option value="time">Time</option>
                                <option value="weight">Weight/Assistance</option>
                            </select>
                        </div>
                        <button type="submit">Save</button>
                        <button type="button" class="btn-secondary" id="cancel-exercise">Cancel</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Skills Page -->
        <div id="skills-page" class="page">
            <h1>Skills</h1>
            <div id="skills-container">
                <div id="skill-tree-view">
                    <h2>Skill Tree</h2>
                    <button id="add-skill-btn" class="btn-primary">Add Skill</button>
                    <canvas id="skill-tree-canvas"></canvas>
                </div>
                <div id="skill-detail-view" style="display: none;">
                    <button id="back-to-tree" class="btn-secondary">← Back to Tree</button>
                    <button id="edit-skill-btn" class="btn-primary" style="display: none;">Edit Skill</button>
                    <div id="skill-detail-content"></div>
                </div>
            </div>
            
            <!-- Add/Edit Skill Modal -->
            <div id="skill-modal" class="modal">
                <div class="modal-content" style="max-width: 700px;">
                    <span class="close" id="close-skill-modal">&times;</span>
                    <h2 id="skill-modal-title">Add Skill</h2>
                    <form id="skill-form">
                        <input type="hidden" id="skill-id-input">
                        <div class="form-group">
                            <label for="skill-name-input">Name:</label>
                            <input type="text" id="skill-name-input" required>
                        </div>
                        <div class="form-group">
                            <label for="skill-description-input">Description:</label>
                            <textarea id="skill-description-input" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Requirements:</label>
                            <div id="requirements-list"></div>
                            <button type="button" id="add-requirement-btn" class="btn-secondary">Add Requirement</button>
                        </div>
                        <div class="form-group">
                            <label for="skill-dependencies-input">Dependencies (comma-separated skill IDs):</label>
                            <input type="text" id="skill-dependencies-input" placeholder="e.g., skill1, skill2">
                        </div>
                        <button type="submit">Save Skill</button>
                        <button type="button" class="btn-secondary" id="cancel-skill">Cancel</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Progress Page -->
        <div id="progress-page" class="page">
            <h1>Progress</h1>
            <div class="form-group">
                <label for="progress-exercise-select">Select Exercise:</label>
                <select id="progress-exercise-select">
                    <option value="">Select an exercise...</option>
                </select>
            </div>
            <div id="progress-charts">
                <div class="chart-container">
                    <h2>Reps/Duration Over Time</h2>
                    <canvas id="progress-chart"></canvas>
                </div>
                <div class="chart-container">
                    <h2>Weekly Volume</h2>
                    <canvas id="volume-chart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
